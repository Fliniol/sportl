<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Spotiglke</title>
    </head>

    <body>

        <div class="player-container">
            
            <div class="window-controls">
                <button id="minimizeButton" class="min-btn">-</button>
                <button id="closeButton" class="close-btn">&times;</button>
            </div>
            
            <h1>Spotiglke</h1>

            <div class="image-container">
                <img id="album-art" src="" alt="Capa da música" class="logo">
                <div class="progress-overlay">
                    <div class="time-info">
                        <span id="current-time">00:00</span>
                        <span id="total-duration">00:00</span>
                    </div>
                    <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                </div>
            </div>

            <div class="slides">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" name="volume" min="0" max="100" value="50">
            </div>

            <div class="controles">
                <button id="shuffleButton" class="icon-btn-ctrl" title="Aleatório">
                    <img id="shuffleImg" src="imagens/gui_random_icon_157051.webp" alt="Randomizar">
                </button>
                <button id="previousButton" class="icon-btn-ctrl">
                    <img src="imagens/seta da esquerda.jpg" alt="Anterior">
                </button>
                <button id="playPauseButton" class="icon-btn-ctrl">
                    <img id="playPauseImg" src="imagens/Pause.png" alt="Play/Pause">
                </button>
                <button id="nextButton" class="icon-btn-ctrl">
                    <img src="imagens/seta direta1.jpg" alt="Próxima">
                </button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
